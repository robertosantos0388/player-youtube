

<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#101010">

  <title>Meu Player YouTube</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      min-height: 100vh;

      background: #101010;

      color: #fff;

      font-family: Arial, sans-serif;

      padding: 24px 16px;

    }

    main { max-width: 850px; margin: auto; }

    h1 { text-align: center; color: #ff3333; }

    p { color: #ccc; text-align: center; }

    form { display: flex; gap: 8px; margin: 24px 0 12px; }

    input {

      flex: 1; min-width: 0; padding: 14px;

      border: 1px solid #444; border-radius: 8px;

      background: #222; color: white; font-size: 16px;

    }

    button {

      padding: 13px 18px; border: 0; border-radius: 8px;

      background: #ff3030; color: white; font-weight: bold;

      cursor: pointer;

    }

    .player {

      position: relative; width: 100%; aspect-ratio: 16 / 9;

      background: #000; border-radius: 12px; overflow: hidden;

      margin-top: 18px;

    }

    iframe { width: 100%; height: 100%; border: 0; }

    .message { min-height: 24px; color: #ffb1b1; text-align: center; }

    .examples { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

    .examples button { background: #333; }

    @media (max-width: 520px) {

      form { flex-direction: column; }

      form button { min-height: 46px; }

    }

  </style>

</head>

<body>

  <main>

    <h1>▶ Meu Player YouTube</h1>

    <p>Cole o link de um vídeo do YouTube para assistir aqui.</p>

    <form id="videoForm">

      <input id="videoUrl" type="url"

        placeholder="Cole o link do YouTube aqui"

        aria-label="Link do vídeo do YouTube">

      <button type="submit">Assistir</button>

    </form>

    <div class="examples">

      <button type="button" id="testButton">Testar player</button>

      <button type="button" id="clearButton">Limpar</button>

    </div>

    <div id="message" class="message" role="status"></div>

    <div class="player" id="player">

      <iframe id="youtubeFrame"

        src="about:blank"

        title="Player de vídeo do YouTube"

        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

        allowfullscreen

        referrerpolicy="strict-origin-when-cross-origin"></iframe>

    </div>

    <p>O vídeo é reproduzido pelo YouTube.</p>

  </main>

  <script>

    const form = document.getElementById('videoForm');

    const input = document.getElementById('videoUrl');

    const frame = document.getElementById('youtubeFrame');

    const message = document.getElementById('message');

    function getVideoId(value) {

      const text = value.trim();

      if (/^[\w-]{11}$/.test(text)) return text;

      try {

        const url = new URL(text);

        const host = url.hostname.toLowerCase().replace(/^www\./, '');

        if (host === 'youtu.be') {

          return url.pathname.split('/').filter(Boolean)[0] || null;

        }

        if (host === 'youtube.com' || host === 'm.youtube.com' ||

            host === 'music.youtube.com' || host === 'youtube-nocookie.com') {

          if (url.pathname === '/watch') return url.searchParams.get('v');

          const parts = url.pathname.split('/').filter(Boolean);

          if (['embed', 'shorts', 'live', 'v'].includes(parts[0])) {

            return parts[1] || null;

          }

        }

      } catch (error) {

        return null;

      }

      return null;

    }

    function playVideo(value) {

      const id = getVideoId(value);

      if (!id || !/^[\w-]{11}$/.test(id)) {

        message.textContent = 'Link inválido. Cole um link válido do YouTube.';

        return;

      }

      frame.src = 'https://www.youtube.com/embed/' +

        encodeURIComponent(id) + '?rel=0';

      message.textContent = 'Vídeo carregado. Se não iniciar, toque em Play.';

    }

    form.addEventListener('submit', function(event) {

      event.preventDefault();

      playVideo(input.value);

    });

    document.getElementById('testButton').addEventListener('click', function() {

      input.value = 'https://www.youtube.com/watch?v=jfKfPfyJRdk';

      playVideo(input.value);

    });

    document.getElementById('clearButton').addEventListener('click', function() {

      input.value = '';

      frame.src = 'about:blank';

      message.textContent = '';

    });

    const params = new URLSearchParams(window.location.search);

    const initialVideo = params.get('v');

    if (initialVideo) {

      input.value = initialVideo;

      playVideo(initialVideo);

    }

  </script>

</body>

</html>
